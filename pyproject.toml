[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbench-local"
version = "0.4.0"
description = "Terminal-first local PC benchmark and security audit tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich==13.9.4",
  "psutil==6.1.1",
  "py-cpuinfo==9.0.0",
  "nvidia-ml-py==13.580.82",
]

[project.optional-dependencies]
windows = ["WMI==1.5.1", "pywebview==6.2.1"]
app = ["pywebview==6.2.1"]

[project.scripts]
pcbench = "pcbench.cli:main"

[tool.setuptools]
packages = [
  "pcbench",
  "pcbench.benchmarks",
  "pcbench.reports",
  "pcbench.security",
  "pcbench.gui",
]

[tool.setuptools.package-data]
"pcbench.gui" = ["web/*"]
"pcbench.security" = ["*.ps1"]
