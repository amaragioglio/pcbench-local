[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbench-local"
version = "0.2.0"
description = "Terminal-first local PC benchmark and security audit tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rich==13.9.4",
  "psutil==6.1.1",
  "py-cpuinfo==9.0.0",
  "GPUtil==1.4.0",
  "py3nvml==0.2.7",
  "speedtest-cli==2.1.3",
]

[project.optional-dependencies]
windows = ["WMI==1.5.1"]

[project.scripts]
pcbench = "pcbench.cli:main"

[tool.setuptools]
packages = [
  "pcbench",
  "pcbench.benchmarks",
  "pcbench.reports",
  "pcbench.security",
]
