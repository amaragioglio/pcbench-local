name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall pcbench
      - name: Tests
        run: python -m pytest
      - name: Smoke test
        run: python main.py run --no-save --quick --skip-security --skip-gpu --skip-network
      - name: Dependency audit
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-dev.txt
          # Windows-only packages cannot be resolved on Linux; audit the pins directly.
          python -m pip_audit --no-deps --disable-pip -r requirements-windows.txt
