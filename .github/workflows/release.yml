name: release

on:
  push:
    tags:
      - "v*"

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-windows.txt
      - name: Build executable
        run: python -m PyInstaller build/pyinstaller.spec --clean --noconfirm
      - name: Rename asset
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\PCBench.exe release\PCBench-$version-windows.exe
          Copy-Item dist\pcbench-cli.exe release\pcbench-cli-$version-windows.exe
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PCBench-*-windows.exe
            release/pcbench-cli-*-windows.exe
